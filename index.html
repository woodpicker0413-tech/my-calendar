<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--rh:92px;--hc:34px}

#mv{flex:1;overflow-y:auto;position:relative;min-height:0}
.wd{position:sticky;top:0;z-index:4;background:var(--bg);display:grid;grid-template-columns:repeat(7,1fr);padding:10px 12px 4px;font-size:11px;color:var(--sub);text-align:center}
#mi{position:relative}
.g{padding:0 12px;position:relative;z-index:1}

.mo{position:absolute;right:4px;bottom:3px;font-size:9px;color:var(--sub)}
.c{height:var(--rh);border-top:1px solid var(--ln);padding:6px 2px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;position:relative}
.c.o{background:var(--o)}.c.v{background:var(--v)}

#wv{flex:1;display:flex;flex-direction:column;min-height:0}

.tc{display:flex;flex-direction:column;gap:10px;text-align:left;padding:12px 14px;border-radius:16px}
.sw{display:flex;gap:8px}.sw i{width:24px;height:24px;border-radius:12px;border:1px solid rgba(120,120,140,.35)}
